[project]
name = "jigsaw"
version = "0.6.0"
description = "Game AI that decides with algorithms first and asks an LLM only when needed"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pydantic>=2"]

[project.scripts]
jigsaw = "jigsaw.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jigsaw"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
