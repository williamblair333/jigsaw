[project]
name = "jigsaw"
version = "0.1.0"
description = "Game AI that decides with algorithms first and asks an LLM only when needed"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jigsaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
